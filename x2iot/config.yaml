name: "X2IOT Gateway"
version: "1.5.34"
slug: "x2iot"
description: "IoT Integration Platform - Satel Integra, MQTT i wiecej"
url: "https://github.com/kroolik89/x2iot"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
uart: true
# GPIO Raspberry Pi: x2iot uses the kernel character device (gpiocdev, uAPI v2), so the chip itself is mapped;
# `gpio` adds the legacy /sys/class/gpio. RPi 3 / 4 / 5 (current kernels): the header is on gpiochip0.
# DS18B20 (1-Wire) is read from /sys/bus/w1 (read-only sysfs) - needs dtoverlay=w1-gpio on the host (DOCS.md).
gpio: true
devices:
  - /dev/gpiochip0
ports:
  "8356/tcp": 8356
ports_description:
  "8356/tcp": "x2iot Web Interface"
ingress: true
ingress_port: 8356
panel_icon: "mdi:chip"
panel_title: "X2IOT Gateway"
panel_admin: false
webui: "http://[HOST]:[PORT:8356]"
# Supervisor API: the add-on sets its own option load_test_secs back to 0 once a load test starts (run.sh).
hassio_api: true
# Load test: only its length here; every other parameter is the built-in default of x2iot (one place, PT plan).
options:
  load_test_secs: 0
schema:
  load_test_secs: "int(0,86400)"
